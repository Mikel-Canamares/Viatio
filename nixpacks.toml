# ==========================================
# Nixpacks Configuration - Viatio Backend
# ==========================================
# Railway usa Nixpacks por defecto para detectar y construir aplicaciones
# Este archivo le indica a Railway que use el subdirectorio viatio-backend

[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "cd viatio-backend",
  "npm install"
]

[phases.build]
cmds = [
  "cd viatio-backend",
  "npm run build"
]

[start]
cmd = "cd viatio-backend && node dist/index.js"

[variables]
NODE_ENV = "production"
