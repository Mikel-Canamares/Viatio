# ==========================================
# Railway Configuration - Viatio Backend
# ==========================================
# Configuración para desplegar viatio-backend desde un monorepo

[build]
builder = "DOCKERFILE"
dockerfilePath = "viatio-backend/Dockerfile"
# Railway ejecuta docker build desde la raíz del repo
# El Dockerfile debe usar rutas relativas a la raíz (ej: COPY viatio-backend/...)

# Solo redeploy si cambian archivos del backend
watchPatterns = ["viatio-backend/**"]

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 100
