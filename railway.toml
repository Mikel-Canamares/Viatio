# ==========================================
# Railway Configuration - Viatio Backend
# ==========================================
# Este archivo le dice a Railway cómo construir
# y desplegar el backend desde un monorepo

[build]
builder = "DOCKERFILE"
dockerfilePath = "viatio-backend/Dockerfile"
dockerContext = "viatio-backend"

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 100

# Configuración del servicio
[[services]]
name = "viatio-backend"
rootDirectory = "viatio-backend"

# Watch paths - Railway solo redesplegará si cambian estos archivos
[[services.watchPaths]]
paths = ["viatio-backend/**"]
